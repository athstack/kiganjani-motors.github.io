<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiganjani Motors - Order System</title>

    <link rel="stylesheet" href="../KAYOMBO/bootstrap-5.0.2-dist/css/bootstrap.min.css">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
        }

        .btn-submit-order {
            background-color: #198754 !important;
            border-color: #198754 !important;
            color: #ffffff !important;
            padding: 12px;
            min-height: 48px;
            font-weight: 500;
            font-size: clamp(0.9rem, 2vw, 1rem);
        }
        .btn-submit-order:hover {
            background-color: #146c43 !important;
        }
        .btn-cancel-order {
            background-color: #6c757d !important;
            border-color: #6c757d !important;
            color: #ffffff !important;
            padding: 12px;
            min-height: 48px;
            font-weight: 500;
            font-size: clamp(0.9rem, 2vw, 1rem);
        }
        .btn-cancel-order:hover {
            background-color: #5a6268 !important;
        }
        .order-card {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            border-radius: 8px;
            border: none;
        }
        .form-control {
            min-height: 48px;
            font-size: clamp(0.85rem, 2vw, 1rem);
        }

        @media (max-width: 576px) {
            .container {
                padding-left: 1rem;
                padding-right: 1rem;
            }
            .order-card {
                max-width: 100%;
            }
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4 order-card">
        <h3 id="formTitle" class="fw-bold mb-1" style="color: #212529;">Place Order</h3>
        <p id="carDetails" class="text-muted small mb-4"></p>

        <form id="userForm">
            <input type="hidden" id="userId">

            <div class="mb-3">
                <input type="text" id="name" class="form-control form-control-lg fs-6" placeholder="Full Name" required>
            </div>

            <div class="mb-3">
                <input type="email" id="email" class="form-control form-control-lg fs-6" placeholder="Email" required>
            </div>

            <div class="mb-3">
                <input type="text" id="phoneNo" class="form-control form-control-lg fs-6" placeholder="Phone" required>
            </div>

            <div class="mb-4">
                <textarea id="location" class="form-control form-control-lg fs-6" rows="2" placeholder="Location" required></textarea>
            </div>

            <div id="formActions" class="d-grid gap-2">
                <button type="submit" id="submitBtn" class="btn btn-submit-order w-100">Submit Order</button>
                <button type="button" class="btn btn-cancel-order w-100" onclick="window.location.href='../index.html'">Cancel</button>
            </div>
        </form>

        <div id="message" class="mt-3"></div>
    </div>
</div>

<script>
function displayAlert(text, type) {
    var messageDiv = document.getElementById("message");
    messageDiv.innerHTML = '<div class="alert alert-' + type + ' py-2 small">' + text + '</div>';
    setTimeout(function() {
        messageDiv.innerHTML = "";
    }, 4000);
}

function startEdit(id, name, email, phoneNo, location) {
    location = location || "";
    document.getElementById("userId").value = id;
    document.getElementById("name").value = name;
    document.getElementById("email").value = email;
    document.getElementById("phoneNo").value = phoneNo;
    document.getElementById("location").value = location;

    document.getElementById("formTitle").innerText = "Update Order Details";
    
    document.getElementById("formActions").innerHTML = '<button type="submit" class="btn btn-info text-white p-2 w-100 fw-bold" style="min-height:48px;">Update Order</button><button type="button" class="btn btn-cancel-order w-100" onclick="resetFormState()">Cancel</button>';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetFormState() {
    document.getElementById("userForm").reset();
    document.getElementById("userId").value = "";
    document.getElementById("formTitle").innerText = "Place Order";
    
    document.getElementById("formActions").innerHTML = '<button type="submit" id="submitBtn" class="btn btn-submit-order w-100">Submit Order</button><button type="button" class="btn btn-cancel-order w-100" onclick="window.location.href=\'../index.html\'">Cancel</button>';
}

document.getElementById("userForm").addEventListener("submit", function(e) {
    e.preventDefault();

    var id = document.getElementById("userId").value;
    var name = document.getElementById("name").value;
    var email = document.getElementById("email").value;
    var phoneNo = document.getElementById("phoneNo").value;
    var location = document.getElementById("location").value;

    var isEditing = id !== "";
    var API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:3000' : 'https://kiganjani-api.vercel.app';
    var baseUrl = API_BASE + "/api/users";
    var targetUrl = isEditing ? baseUrl + "/" + id : baseUrl;
    var targetMethod = isEditing ? "PUT" : "POST";

    fetch(targetUrl, {
        method: targetMethod,
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ name: name, email: email, phoneNo: phoneNo, location: location })
    }).then(function(response) {
        return response.json().then(function(data) {
            if (response.ok) {
                displayAlert(data.message || "Order processed successfully!", "success");
                resetFormState();
            } else {
                displayAlert(data.message || "An error occurred.", "danger");
            }
        });
    }).catch(function(error) {
        displayAlert("Server error. Make sure API endpoint is reachable.", "danger");
    });
});
</script>

<script>
  var urlParams = new URLSearchParams(window.location.search);
  var carName = urlParams.get('car') || "Selected Car";
  var carPrice = urlParams.get('price') || "0";

  document.getElementById("carDetails").innerText = "Car: " + carName + " | Price: $" + carPrice;
</script>

</body>
</html>
