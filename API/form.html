<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiganjani Motors - Order System</title>

    <link rel="stylesheet" href="../KAYOMBO/bootstrap-5.0.2-dist/css/bootstrap.min.css">
    
    <style>
        /* Exact color match styling from the reference design */
        .btn-submit-order {
            background-color: #198754 !important;
            border-color: #198754 !important;
            color: #ffffff !important;
            padding: 10px;
            font-weight: 500;
        }
        .btn-submit-order:hover {
            background-color: #146c43 !important;
        }
        .btn-cancel-order {
            background-color: #6c757d !important;
            border-color: #6c757d !important;
            color: #ffffff !important;
            padding: 10px;
            font-weight: 500;
        }
        .btn-cancel-order:hover {
            background-color: #5a6268 !important;
        }
        .order-card {
            max-width: 500px;
            margin: 0 auto;
            border-radius: 8px;
            border: none;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4 order-card">
        <h3 id="formTitle" class="fw-bold mb-1" style="color: #212529;">Place Order</h3>
        <p id="carDetails" class="text-muted small mb-4"></p>

        <form id="userForm">
            <input type="hidden" id="userId">

            <div class="mb-3">
                <input type="text" id="name" class="form-control form-control-lg fs-6" placeholder="Full Name" required>
            </div>

            <div class="mb-3">
                <input type="email" id="email" class="form-control form-control-lg fs-6" placeholder="Email" required>
            </div>

            <div class="mb-3">
                <input type="text" id="phoneNo" class="form-control form-control-lg fs-6" placeholder="Phone" required>
            </div>

            <div class="mb-4">
                <textarea id="location" class="form-control form-control-lg fs-6" rows="2" placeholder="Location" required></textarea>
            </div>

            <div id="formActions" class="d-grid gap-2">
                <button type="submit" id="submitBtn" class="btn btn-submit-order w-100">Submit Order</button>
                <button type="button" class="btn btn-cancel-order w-100" onclick="window.location.href='../index.html'">Cancel</button>
            </div>
        </form>

        <div id="message" class="mt-3"></div>
    </div>
</div>

<script>
// Helper function to show a status message that disappears after 4 seconds
function displayAlert(text, type) {
    const messageDiv = document.getElementById("message");
    messageDiv.innerHTML = `
        <div class="alert alert-${type} py-2 small">
            ${text}
        </div>
    `;
    setTimeout(() => {
        messageDiv.innerHTML = "";
    }, 4000);
}

// Refactored to seamlessly switch the standalone modal container into Edit Mode
function startEdit(id, name, email, phoneNo, location = "") {
    document.getElementById("userId").value = id;
    document.getElementById("name").value = name;
    document.getElementById("email").value = email;
    document.getElementById("phoneNo").value = phoneNo;
    document.getElementById("location").value = location;

    document.getElementById("formTitle").innerText = "Update Order Details";
    
    document.getElementById("formActions").innerHTML = `
        <button type="submit" class="btn btn-info text-white p-2 w-100 fw-bold">Update Order</button>
        <button type="button" class="btn btn-cancel-order w-100" onclick="resetFormState()">Cancel</button>
    `;

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Restores the form state layout securely back to standard submission mode
function resetFormState() {
    document.getElementById("userForm").reset();
    document.getElementById("userId").value = "";
    document.getElementById("formTitle").innerText = "Place Order";
    
    document.getElementById("formActions").innerHTML = `
        <button type="submit" id="submitBtn" class="btn btn-submit-order w-100">Submit Order</button>
        <button type="button" class="btn btn-cancel-order w-100" onclick="window.location.href='../index.html'">Cancel</button>
    `;
}

// Unified form submission managing both creating (POST) and updating (PUT) targets securely
document.getElementById("userForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const id = document.getElementById("userId").value;
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phoneNo = document.getElementById("phoneNo").value;
    const location = document.getElementById("location").value;

    const isEditing = id !== "";/*
    const targetUrl = isEditing ? `http://localhost:3000/api/users/${id}` : "http://localhost:3000/api/users";
    const targetMethod = isEditing ? "PUT" : "POST";*/
    const baseUrl = "https://kiganjani-api.vercel.app/api/users";
    const targetUrl = isEditing ? `${baseUrl}/${id}` : baseUrl;

    const targetMethod = isEditing ? "PUT" : "POST";

    try {
        const response = await fetch(targetUrl, {
            method: targetMethod,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ name, email, phoneNo, location })
        });

        const data = await response.json();

        if (response.ok) {
            displayAlert(data.message || "Order processed successfully!", "success");
            resetFormState();
        } else {
            displayAlert(data.message || "An error occurred.", "danger");
        }

    } catch (error) {
        displayAlert("Server error. Make sure API endpoint is reachable.", "danger");
    }
});
</script>

<script>
  // 1. Read the car name and price from the browser URL address bar
  const urlParams = new URLSearchParams(window.location.search);
  const carName = urlParams.get('car') || "Selected Car";
  const carPrice = urlParams.get('price') || "0";

  // 2. FIXED: Changed "car-details" to "carDetails" to match your HTML ID perfectly!
  document.getElementById("carDetails").innerText = `Car: ${carName} | Price: $${carPrice}`;
</script>

</body>
</html>
