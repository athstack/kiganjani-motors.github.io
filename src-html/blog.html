<!-- Category Filters -->
<section class="py-5">
  <div class="container">
    <div class="filter-buttons mb-4" role="group" aria-label="Filter posts">
      <button type="button" class="filter-btn is-active" onclick="filterPosts('all', this)" aria-pressed="true">All</button>
      <button type="button" class="filter-btn" onclick="filterPosts('tips', this)" aria-pressed="false">Tips</button>
      <button type="button" class="filter-btn" onclick="filterPosts('reviews', this)" aria-pressed="false">Reviews</button>
      <button type="button" class="filter-btn" onclick="filterPosts('industry', this)" aria-pressed="false">Industry</button>
      <button type="button" class="filter-btn" onclick="filterPosts('guides', this)" aria-pressed="false">Guides</button>
    </div>

    <div id="blogGrid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
      <div class="text-center py-4" style="grid-column:1/-1"><div class="spinner-border text-success"></div></div>
    </div>

</section>

</div>

<script>
var API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:3000' : 'https://kiganjani-api.vercel.app';
var blogData = [];
var categoryIcons = { tips: 'bi-trophy', reviews: 'bi-star-fill', industry: 'bi-newspaper', guides: 'bi-book' };
var categoryColors = { tips: '#0d6efd,#6610f2', reviews: '#6f42c1,#d63384', industry: '#198754,#20c997', guides: '#ffc107,#ffc720' };

function loadBlog() {
  fetch(API_BASE + "/api/blog")
    .then(function(r) { return r.json(); })
    .then(function(data) {
      blogData = data;
      renderBlog(data);
    }).catch(function() {
      document.getElementById("blogGrid").innerHTML = '<div class="text-center text-muted py-4" style="grid-column:1/-1">Failed to load blog posts.</div>';
    });
}

function renderBlog(data) {
  var grid = document.getElementById("blogGrid");
  if (!data.length) { grid.innerHTML = '<div class="text-center text-muted py-4" style="grid-column:1/-1">No blog posts yet.</div>'; return; }
  var html = "";
  data.forEach(function(post, i) {
    var cat = post.category || 'tips';
    var colors = categoryColors[cat] || '#198754,#20c997';
    var icon = categoryIcons[cat] || 'bi-journal-text';
    var d = new Date(post.created_at);
    var dateStr = d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
    var excerpt = post.excerpt || (post.content ? post.content.substring(0, 120) + "..." : "");
    html += '<div class="blog-post" data-category="' + esc(cat) + '">' +
      '<div class="card shadow-sm border-0 h-100">' +
      '<div style="height:180px;background:linear-gradient(135deg,' + colors + ');display:flex;align-items:center;justify-content:center;">' +
      '<i class="bi ' + icon + ' text-white" style="font-size:3rem;"></i></div>' +
      '<div class="card-body">' +
      '<h5 class="fw-bold">' + esc(post.title) + '</h5>' +
      '<p class="text-muted small mb-2">' + dateStr + '</p>' +
      '<p class="small">' + esc(excerpt) + '</p>' +
      '</div></div></div>';
  });
  grid.innerHTML = html;
}

function esc(s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

function filterPosts(category, btn) {
  document.querySelectorAll(".filter-buttons .filter-btn").forEach(function(b) {
    var active = b === btn;
    b.classList.toggle("is-active", active);
    b.setAttribute("aria-pressed", active ? "true" : "false");
  });
  if (category === "all") { renderBlog(blogData); return; }
  renderBlog(blogData.filter(function(p) { return p.category === category; }));
}

function isMobile() { return window.innerWidth < 992; }
function openSidebar() {
  var sidebar = document.getElementById("sidebar");
  var overlay = document.getElementById("sidebarOverlay");
  sidebar.classList.add("mobile-open");
  overlay.classList.add("active");
  overlay.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}
function closeSidebar() {
  var sidebar = document.getElementById("sidebar");
  var overlay = document.getElementById("sidebarOverlay");
  sidebar.classList.remove("mobile-open");
  overlay.classList.remove("active");
  overlay.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}
function toggleSidebar() {
  if (isMobile()) {
    var sidebar = document.getElementById("sidebar");
    if (sidebar.classList.contains("mobile-open")) { closeSidebar(); } else { openSidebar(); }
  }
}
document.getElementById("sidebarOverlay").addEventListener("click", closeSidebar);
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape" && document.getElementById("sidebar").classList.contains("mobile-open")) { closeSidebar(); }
});
window.addEventListener("resize", function() { if (!isMobile()) { closeSidebar(); } });
document.querySelectorAll("#sidebar .nav-link").forEach(function(link) {
  link.addEventListener("click", function() { if (isMobile()) { closeSidebar(); } });
});
loadBlog();
</script>

</body>
