<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kiganjani Motors - Admin</title><link rel="stylesheet" href="KAYOMBO/bootstrap-5.0.2-dist/css/bootstrap.min.css"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"><script src="KAYOMBO/bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;overflow:hidden}.table th{white-space:nowrap}.badge-approved,.badge-completed,.badge-confirmed,.badge-delivered,.badge-published,.badge-resolved{background:#198754;color:#fff}.badge-open,.badge-pending,.badge-reserved{background:#ffc107;color:#212529}.badge-in_progress,.badge-processing{background:#0dcaf0;color:#212529}.badge-shipped{background:#0d6efd;color:#fff}.badge-cancelled,.badge-closed,.badge-unpublished{background:#dc3545;color:#fff}.badge-active,.badge-returned{background:#198754;color:#fff}.stars{color:#198754}.btn-delete{color:#dc3545;border:1px solid rgba(220,53,69,.3);background:0 0;font-size:.8rem;padding:2px 6px;transition:.15s}.btn-delete:hover{background:#dc3545;color:#fff;border-color:#dc3545}#siteFrame{position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:0}.admin-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(2px)}.admin-overlay.hidden{display:none}.login-card{max-width:400px;width:90%;position:relative}.admin-dashboard-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:#f4f6f9;display:none;overflow:hidden}.admin-dashboard-overlay.active{display:flex}.admin-sidebar{width:230px;min-width:230px;height:100vh;height:100dvh;background:#111;color:#fff;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:24px}.admin-sid dia(max-width:768px){.admin-sidebar{position:fixed;top:0;left:0;height:100vh;height:100dvh;z-index:10002;transform:translateX(-100%);transition:transform .3s}.admin-sidebar.show{transform:translateX(0)}}.modal-backdrop{z-index:10003!important}.modal{z-index:10004!important}</style></head><body><!-- Website iframe (always behind) --><iframe id="siteFrame" src="index.html"></iframe><!-- Login Overlay --><div class="admin-overlay" id="loginOverlay"><div class="login-card"><div class="card shadow border-0"><div class="card-body p-4 text-center"><button class="btn position-absolute top-0 end-0 m-2 p-1 text-muted" onclick="closeLogin()" style="font-size:1.2rem;border:none;background:none;" title="Close">&times;</button><i class="bi bi-shield-lock text-success" style="font-size:3rem;"></i><h4 class="fw-bold mt-2">Admin Dashboard</h4><p class="text-muted small">Enter your admin password</p><div id="loginMsg"></div><div class="mb-3"><input type="password" id="adminPassword" class="form-control form-control-lg" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"></div><button class="btn btn-success btn-lg w-100" onclick="doLogin()">Login</button></div></div></div></div><!-- Dashboard Overlay (full-screen) --><div class="admin-dashboard-overlay" id="dashboardOverlay"><!-- Mobile sidebar backdrop --><div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div><!-- Sidebar --><aside class="admin-sidebar" id="adminSidebar"><div class="brand"><img src="IMAGES/official_logo.png" alt="Logo"><span>Kiganjani Motors<small>Admin Panel</small></span></div><div class="nav-section">Main</div><a class="nav-item active" onclick="switchTab('reviews',this)" data-tab="reviews"><i class="bi bi-star"></i>Reviews<span class="nav-badge" id="count-reviews">0</span></a><a class="nav-item" onclick="switchTab('bookings',this)" data-tab="bookings"><i class="bi bi-calendar-check"></i>Bookings<span class="nav-badge" id="count-bookings">0</span></a><a class="nav-item" o n-outline-success btn-sm" onclick="loadSection()"><i class="bi bi-arrow-clockwise"></i></button></div></div></nav><div class="px-3 py-3" style="flex:1;overflow-y:auto;"><div id="dashboardMsg"></div><div class="card shadow-sm border-0"><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-dark" id="tableHead"></thead><tbody id="tableBody"><tr><td colspan="8" class="text-center text-muted py-4">Loading...</td></tr></tbody></table></div></div></div></div><div class="admin-footer"><span>&copy; 2026 Kiganjani Motors Admin Panel. All rights reserved.</span><span><span class="status-dot"></span>System Online</span></div></div></div><script src="dist/admin.min.js"></script><script>

</script><!-- Add Service Record Modal --><div class="modal fade" id="addServiceModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header bg-success text-white"><h5 class="modal-title"><i class="bi bi-tools me-2"></i>New Service Record</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><form onsubmit="submitServiceRecord(event)"><div class="mb-2"><label class="form-label small fw-bold">Name *</label><input type="text" id="svcName" class="form-control" required></div><div class="mb-2"><label class="form-label small fw-bold">Email</label><input type="email" id="svcEmail" class="form-control"></div><div class="mb-2"><label class="form-label small fw-bold">Phone *</label><input type="tel" id="svcPhone" class="form-control" required></div><div class="mb-2"><label class="form-label small fw-bold">Service Type *</label><select id="svcType" class="form-select" required><option value="">Select service...</option><option>Oil Change</option><option>Tire Rotation</option><option>Brake Service</option><option>Engine Diagnostic</option><option>Transmission Service</option><option>Air Conditioning</option><option>Battery Replacement</option><option>Wheel Alignment</option><option>General Inspection</option></select></div><div class="mb-2"><label class="form-label small fw-bold">Vehicle</label><input type="text" id="svcVehicle" class="form-control" placeholder="e.g. Toyota Corolla"></div><div class="mb-2"><label class="form-label small fw-bold">Notes</label><textarea id="svcNotes" class="form-control" rows="2" placeholder="Additional details..."></textarea></div><div id="serviceAddResult"></div><button type="submit" class="btn btn-success w-100">Save Record</button></form></div></div></div></div><!-- Add Blog Post Modal --><div class="modal fade" id="addBlogModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header bg-success text-
