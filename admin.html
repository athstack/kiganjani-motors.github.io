<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiganjani Motors - Admin</title>
<link rel="stylesheet" href="KAYOMBO/bootstrap-5.0.2-dist/css/bootstrap.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<script src="KAYOMBO/bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
<style>
body{background:#f4f6f9;font-family:Arial,sans-serif}
.login-box{max-width:380px;margin:12% auto}
.table th{white-space:nowrap}
.badge-approved,.badge-completed,.badge-confirmed,.badge-delivered,.badge-resolved,.badge-published{background:#198754;color:#fff}
.badge-pending,.badge-open,.badge-reserved{background:#ffc107;color:#212529}
.badge-processing,.badge-in_progress{background:#0dcaf0;color:#212529}
.badge-shipped{background:#0d6efd;color:#fff}
.badge-cancelled,.badge-closed,.badge-unpublished{background:#dc3545;color:#fff}
.badge-active,.badge-returned{background:#198754;color:#fff}
.stars{color:#198754}
.back-link{display:block;text-align:center;margin-top:15px;color:#6c757d;text-decoration:none;font-size:.9rem;transition:color .2s}
.back-link:hover{color:#198754}
.tab-btn{padding:10px 18px;border:none;background:transparent;color:#6c757d;font-weight:600;font-size:.9rem;border-bottom:3px solid transparent;cursor:pointer;transition:all .2s}
.tab-btn:hover{color:#198754}
.tab-btn.active{color:#198754;border-bottom-color:#198754}
.tab-count{background:#198754;color:#fff;border-radius:50%;padding:2px 7px;font-size:.7rem;margin-left:5px}
</style>
</head>
<body>

<!-- Login -->
<div id="loginScreen">
  <div class="login-box">
    <div class="card shadow border-0">
      <div class="card-body p-4 text-center">
        <i class="bi bi-shield-lock text-success" style="font-size:3rem;"></i>
        <h4 class="fw-bold mt-2">Admin Dashboard</h4>
        <p class="text-muted small">Enter your admin password</p>
        <div id="loginMsg"></div>
        <div class="mb-3">
          <input type="password" id="adminPassword" class="form-control form-control-lg" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <button class="btn btn-success btn-lg w-100" onclick="doLogin()">Login</button>
        <a href="index.html" class="back-link"><i class="bi bi-arrow-left me-1"></i>Back to Website</a>
      </div>
    </div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboardScreen" style="display:none;">
  <nav class="navbar navbar-dark bg-dark mb-0">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold"><i class="bi bi-speedometer2 me-2"></i>Admin Dashboard</span>
      <button class="btn btn-outline-light btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </nav>

  <!-- Tab Bar -->
  <div class="bg-white border-bottom px-3 py-1 d-flex gap-1 flex-wrap" id="tabBar">
    <button class="tab-btn active" onclick="switchTab('reviews',this)"><i class="bi bi-star me-1"></i>Reviews<span class="tab-count" id="count-reviews">0</span></button>
    <button class="tab-btn" onclick="switchTab('bookings',this)"><i class="bi bi-calendar-check me-1"></i>Bookings<span class="tab-count" id="count-bookings">0</span></button>
    <button class="tab-btn" onclick="switchTab('services',this)"><i class="bi bi-tools me-1"></i>Services<span class="tab-count" id="count-services">0</span></button>
    <button class="tab-btn" onclick="switchTab('rentals',this)"><i class="bi bi-car-front me-1"></i>Rentals<span class="tab-count" id="count-rentals">0</span></button>
    <button class="tab-btn" onclick="switchTab('parts',this)"><i class="bi bi-cart3 me-1"></i>Part Orders<span class="tab-count" id="count-parts">0</span></button>
    <button class="tab-btn" onclick="switchTab('tickets',this)"><i class="bi bi-headset me-1"></i>Tickets<span class="tab-count" id="count-tickets">0</span></button>
    <button class="tab-btn" onclick="switchTab('blog',this)"><i class="bi bi-journal-text me-1"></i>Blog<span class="tab-count" id="count-blog">0</span></button>
    <button class="tab-btn" onclick="switchTab('users',this)"><i class="bi bi-people me-1"></i>Orders<span class="tab-count" id="count-users">0</span></button>
  </div>

  <div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0" id="sectionTitle">Reviews</h5>
      <div>
        <button class="btn btn-success btn-sm me-1" id="addNewBtn" style="display:none;" onclick="showAddModal()"><i class="bi bi-plus-lg me-1"></i>New</button>
        <button class="btn btn-outline-success btn-sm" onclick="loadSection()"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
      </div>
    </div>
    <div id="dashboardMsg"></div>
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark" id="tableHead"></thead>
            <tbody id="tableBody">
              <tr><td colspan="8" class="text-center text-muted py-4">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var API_BASE = "https://kiganjani-api.vercel.app";
var adminPassword = "";
var currentTab = "reviews";
var currentData = [];

function doLogin() {
  var pw = document.getElementById("adminPassword").value.trim();
  var msg = document.getElementById("loginMsg");
  if (!pw) { msg.innerHTML = '<div class="alert alert-warning py-2 small">Enter password</div>'; return; }
  msg.innerHTML = '<div class="text-center"><div class="spinner-border text-success spinner-border-sm"></div></div>';
  fetch(API_BASE + "/api/admin/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: pw })
  }).then(function(r) {
    return r.json().then(function(d) { return { ok: r.ok, data: d }; });
  }).then(function(resp) {
    if (resp.ok) {
      adminPassword = pw;
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboardScreen").style.display = "block";
      loadSection();
    } else {
      msg.innerHTML = '<div class="alert alert-danger py-2 small">' + (resp.data.message || "Login failed") + '</div>';
    }
  }).catch(function() {
    msg.innerHTML = '<div class="alert alert-danger py-2 small">Server error</div>';
  });
}

function doLogout() {
  adminPassword = "";
  document.getElementById("dashboardScreen").style.display = "none";
  document.getElementById("loginScreen").style.display = "block";
  document.getElementById("adminPassword").value = "";
  document.getElementById("loginMsg").innerHTML = "";
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach(function(b) { b.classList.remove("active"); });
  el.classList.add("active");
  var titles = {reviews:"Customer Reviews",bookings:"Appointments",services:"Service Records",rentals:"Car Rentals",parts:"Part Orders",tickets:"Support Tickets",blog:"Blog Posts",users:"Car Orders"};
  document.getElementById("sectionTitle").textContent = titles[tab] || tab;
  var addBtn = document.getElementById("addNewBtn");
  if (tab === "services" || tab === "blog") { addBtn.style.display = "inline-block"; addBtn.textContent = tab === "services" ? "+ New Record" : "+ New Post"; }
  else { addBtn.style.display = "none"; }
  loadSection();
}

function esc(str) { var d = document.createElement("div"); d.textContent = str || ""; return d.innerHTML; }

function makeStars(n) {
  var s = "";
  for (var i = 0; i < 5; i++) s += '<i class="bi bi-star' + (i < n ? '-fill' : '') + '"></i>';
  return '<span class="stars">' + s + '</span>';
}

function fmtDate(d) {
  if (!d) return "-";
  return new Date(d).toLocaleDateString("en-US", { year:"numeric", month:"short", day:"numeric" });
}

function statusBadge(status) {
  var cls = "badge bg-secondary";
  var map = { approved:"badge-approved",pending:"badge-pending",confirmed:"badge-confirmed",completed:"badge-completed",cancelled:"badge-cancelled",reserved:"badge-reserved",active:"badge-active",returned:"badge-returned",processing:"badge-processing",shipped:"badge-shipped",delivered:"badge-delivered",open:"badge-open",in_progress:"badge-in_progress",resolved:"badge-resolved",closed:"badge-closed",published:"badge-published",unpublished:"badge-unpublished"};
  return '<span class="badge ' + (map[status] || cls) + '">' + esc(status) + '</span>';
}

function loadSection() {
  document.getElementById("tableBody").innerHTML = '<tr><td colspan="10" class="text-center py-4"><div class="spinner-border text-success"></div></td></tr>';
  fetch(API_BASE + "/api/admin/" + currentTab + "?password=" + encodeURIComponent(adminPassword))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!Array.isArray(data)) {
        document.getElementById("tableBody").innerHTML = '<tr><td colspan="10" class="text-center text-danger py-4">' + esc(data.message) + '</td></tr>';
        return;
      }
      currentData = data;
      document.getElementById("count-" + currentTab).textContent = data.length;
      renderTable(data);
    }).catch(function() {
      document.getElementById("tableBody").innerHTML = '<tr><td colspan="10" class="text-center text-danger py-4">Failed to load</td></tr>';
    });
}

function renderTable(data) {
  var head = "";
  var rows = "";
  switch(currentTab) {
    case "reviews":
      head = '<tr><th>#</th><th>Name</th><th>Vehicle</th><th>Rating</th><th>Review</th><th>Status</th><th>Date</th><th>Actions</th></tr>';
      data.forEach(function(r) {
        rows += '<tr><td>' + r.id + '</td><td>' + esc(r.name) + '<br><small class="text-muted">' + esc(r.email||'') + '</small></td><td>' + esc(r.vehicle||'-') + '</td><td>' + makeStars(r.rating) + '</td><td style="max-width:250px;font-size:.85rem;">' + esc(r.review_text) + '</td><td>' + (r.approved ? statusBadge('approved') : statusBadge('pending')) + '</td><td><small>' + fmtDate(r.created_at) + '</small></td><td style="white-space:nowrap">';
        if (!r.approved) rows += '<button class="btn btn-sm btn-success me-1" onclick="approveReview(' + r.id + ')"><i class="bi bi-check-lg"></i></button>';
        rows += '<button class="btn btn-sm btn-danger" onclick="deleteRecord(\'reviews\',' + r.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
      });
      break;
    case "bookings":
      head = '<tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>Service</th><th>Date</th><th>Vehicle</th><th>Status</th><th>Actions</th></tr>';
      data.forEach(function(r) {
        rows += '<tr><td>' + r.id + '</td><td>' + esc(r.name) + '</td><td><small>' + esc(r.email) + '</small></td><td>' + esc(r.phone) + '</td><td>' + esc(r.service_type) + '</td><td><small>' + fmtDate(r.preferred_date) + ' ' + esc(r.preferred_time||'') + '</small></td><td>' + esc(r.vehicle||'-') + '</td><td>' + statusBadge(r.status) + '</td><td style="white-space:nowrap">';
        if (r.status === 'pending') rows += '<button class="btn btn-sm btn-success me-1" onclick="updateStatus(\'bookings\',' + r.id + ',\'confirmed\')">Confirm</button>';
        if (r.status === 'confirmed') rows += '<button class="btn btn-sm btn-info text-white me-1" onclick="updateStatus(\'bookings\',' + r.id + ',\'completed\')">Complete</button>';
        if (r.status !== 'cancelled' && r.status !== 'completed') rows += '<button class="btn btn-sm btn-warning me-1" onclick="updateStatus(\'bookings\',' + r.id + ',\'cancelled\')">Cancel</button>';
        rows += '<button class="btn btn-sm btn-danger" onclick="deleteRecord(\'bookings\',' + r.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
      });
      break;
    case "services":
      head = '<tr><th>#</th><th>Name</th><th>Phone</th><th>Service</th><th>Vehicle</th><th>Notes</th><th>Status</th><th>Date</th><th>Actions</th></tr>';
      data.forEach(function(r) {
        rows += '<tr><td>' + r.id + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.phone) + '</td><td>' + esc(r.service_type) + '</td><td>' + esc(r.vehicle||'-') + '</td><td style="max-width:150px;font-size:.85rem;">' + esc(r.notes||'-') + '</td><td>' + statusBadge(r.status) + '</td><td><small>' + fmtDate(r.created_at) + '</small></td><td style="white-space:nowrap">';
        if (r.status === 'pending') rows += '<button class="btn btn-sm btn-info text-white me-1" onclick="updateStatus(\'services\',' + r.id + ',\'in_progress\')">Start</button>';
        if (r.status === 'in_progress') rows += '<button class="btn btn-sm btn-success me-1" onclick="updateStatus(\'services\',' + r.id + ',\'completed\')">Complete</button>';
        rows += '<button class="btn btn-sm btn-danger" onclick="deleteRecord(\'services\',' + r.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
      });
      break;
    case "rentals":
      head = '<tr><th>#</th><th>Name</th><th>Email</th><th>Vehicle</th><th>Class</th><th>From</th><th>To</th><th>Price</th><th>Status</th><th>Actions</th></tr>';
      data.forEach(function(r) {
        rows += '<tr><td>' + r.id + '</td><td>' + esc(r.name) + '</td><td><small>' + esc(r.email) + '</small></td><td>' + esc(r.vehicle) + '</td><td>' + esc(r.rental_class||'-') + '</td><td><small>' + fmtDate(r.start_date) + '</small></td><td><small>' + fmtDate(r.end_date) + '</small></td><td>$' + (r.total_price||0) + '</td><td>' + statusBadge(r.status) + '</td><td style="white-space:nowrap">';
        if (r.status === 'reserved') rows += '<button class="btn btn-sm btn-success me-1" onclick="updateStatus(\'rentals\',' + r.id + ',\'active\')">Activate</button>';
        if (r.status === 'active') rows += '<button class="btn btn-sm btn-info text-white me-1" onclick="updateStatus(\'rentals\',' + r.id + ',\'returned\')">Return</button>';
        if (r.status !== 'cancelled' && r.status !== 'returned') rows += '<button class="btn btn-sm btn-warning me-1" onclick="updateStatus(\'rentals\',' + r.id + ',\'cancelled\')">Cancel</button>';
        rows += '<button class="btn btn-sm btn-danger" onclick="deleteRecord(\'rentals\',' + r.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
      });
      break;
    case "parts":
      head = '<tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr>';
      data.forEach(function(r) {
        var items = r.items;
        if (typeof items === 'string') { try { items = JSON.parse(items); } catch(e){} }
        var itemStr = Array.isArray(items) ? items.map(function(i){return i.name;}).join(', ') : esc(String(items||''));
        rows += '<tr><td>' + r.id + '</td><td>' + esc(r.name) + '</td><td><small>' + esc(r.email) + '</small></td><td>' + esc(r.phone) + '</td><td style="max-width:200px;font-size:.85rem;">' + itemStr + '</td><td>$' + (r.total||0) + '</td><td>' + statusBadge(r.status) + '</td><td><small>' + fmtDate(r.created_at) + '</small></td><td style="white-space:nowrap">';
        if (r.status === 'pending') rows += '<button class="btn btn-sm btn-info text-white me-1" onclick="updateStatus(\'parts\',' + r.id + ',\'processing\')">Process</button>';
        if (r.status === 'processing') rows += '<button class="btn btn-sm btn-primary me-1" onclick="updateStatus(\'parts\',' + r.id + ',\'shipped\')">Ship</button>';
        if (r.status === 'shipped') rows += '<button class="btn btn-sm btn-success me-1" onclick="updateStatus(\'parts\',' + r.id + ',\'delivered\')">Deliver</button>';
        rows += '<button class="btn btn-sm btn-danger" onclick="deleteRecord(\'parts\',' + r.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
      });
      break;
    case "tickets":
      head = '<tr><th>#</th><th>Name</th><th>Email</th><th>Dept</th><th>Subject</th><th>Message</th><th>Status</th><th>Date</th><th>Actions</th></tr>';
      data.forEach(function(r) {
        rows += '<tr><td>' + r.id + '</td><td>' + esc(r.name) + '</td><td><small>' + esc(r.email) + '</small></td><td>' + esc(r.department||'-') + '</td><td>' + esc(r.subject) + '</td><td style="max-width:200px;font-size:.85rem;">' + esc(r.message) + '</td><td>' + statusBadge(r.status) + '</td><td><small>' + fmtDate(r.created_at) + '</small></td><td style="white-space:nowrap">';
        if (r.status === 'open') rows += '<button class="btn btn-sm btn-info text-white me-1" onclick="updateStatus(\'tickets\',' + r.id + ',\'in_progress\')">In Progress</button>';
        if (r.status === 'in_progress') rows += '<button class="btn btn-sm btn-success me-1" onclick="updateStatus(\'tickets\',' + r.id + ',\'resolved\')">Resolve</button>';
        if (r.status !== 'closed') rows += '<button class="btn btn-sm btn-secondary me-1" onclick="updateStatus(\'tickets\',' + r.id + ',\'closed\')">Close</button>';
        rows += '<button class="btn btn-sm btn-danger" onclick="deleteRecord(\'tickets\',' + r.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
      });
      break;
    case "blog":
      head = '<tr><th>#</th><th>Title</th><th>Category</th><th>Published</th><th>Date</th><th>Actions</th></tr>';
      data.forEach(function(r) {
        rows += '<tr><td>' + r.id + '</td><td>' + esc(r.title) + '</td><td>' + esc(r.category||'-') + '</td><td>' + (r.published ? statusBadge('published') : statusBadge('unpublished')) + '</td><td><small>' + fmtDate(r.created_at) + '</small></td><td style="white-space:nowrap">';
        rows += '<button class="btn btn-sm btn-outline-success me-1" onclick="toggleBlog(' + r.id + ')"><i class="bi bi-eye' + (r.published ? '-slash' : '') + '"></i></button>';
        rows += '<button class="btn btn-sm btn-danger" onclick="deleteRecord(\'blog\',' + r.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
      });
      break;
    case "users":
      head = '<tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>Location</th><th>Date</th><th>Actions</th></tr>';
      data.forEach(function(r) {
        rows += '<tr><td>' + r.id + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.email) + '</td><td>' + esc(r.phoneNo||'-') + '</td><td>' + esc(r.location||'-') + '</td><td><small>' + fmtDate(r.created_at) + '</small></td><td>';
        rows += '<button class="btn btn-sm btn-danger" onclick="deleteRecord(\'users\',' + r.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
      });
      break;
  }
  document.getElementById("tableHead").innerHTML = head;
  document.getElementById("tableBody").innerHTML = rows || '<tr><td colspan="10" class="text-center text-muted py-4">No records found</td></tr>';
}

function showMsg(text, type) {
  var msg = document.getElementById("dashboardMsg");
  msg.innerHTML = '<div class="alert alert-' + type + ' py-2 small">' + text + '</div>';
  setTimeout(function() { msg.innerHTML = ""; }, 2500);
}

function approveReview(id) {
  fetch(API_BASE + "/api/admin/reviews/" + id + "/approve", {
    method: "POST", headers: { "X-Admin-Password": adminPassword }
  }).then(function(r) { return r.json(); }).then(function(d) {
    showMsg(d.message, "success"); loadSection();
  }).catch(function() { showMsg("Failed", "danger"); });
}

function updateStatus(section, id, status) {
  fetch(API_BASE + "/api/admin/" + section + "/" + id + "/status", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Admin-Password": adminPassword },
    body: JSON.stringify({ status: status })
  }).then(function(r) { return r.json(); }).then(function(d) {
    showMsg(d.message, "success"); loadSection();
  }).catch(function() { showMsg("Failed", "danger"); });
}

function toggleBlog(id) {
  fetch(API_BASE + "/api/admin/blog/" + id + "/toggle", {
    method: "POST", headers: { "X-Admin-Password": adminPassword }
  }).then(function(r) { return r.json(); }).then(function(d) {
    showMsg(d.message, "success"); loadSection();
  }).catch(function() { showMsg("Failed", "danger"); });
}

function deleteRecord(section, id) {
  if (!confirm("Delete this record permanently?")) return;
  fetch(API_BASE + "/api/admin/" + section + "/" + id, {
    method: "DELETE", headers: { "X-Admin-Password": adminPassword }
  }).then(function(r) { return r.json(); }).then(function(d) {
    showMsg(d.message, "success"); loadSection();
  }).catch(function() { showMsg("Failed", "danger"); });
}

// ==========================================
// ADD NEW RECORDS (Services + Blog)
// ==========================================
function showAddModal() {
  if (currentTab === "services") {
    document.getElementById("addServiceModal").querySelector("form").reset();
    new bootstrap.Modal(document.getElementById("addServiceModal")).show();
  } else if (currentTab === "blog") {
    document.getElementById("addBlogModal").querySelector("form").reset();
    new bootstrap.Modal(document.getElementById("addBlogModal")).show();
  }
}

function submitServiceRecord(e) {
  e.preventDefault();
  var result = document.getElementById("serviceAddResult");
  var data = {
    name: document.getElementById("svcName").value.trim(),
    email: document.getElementById("svcEmail").value.trim(),
    phone: document.getElementById("svcPhone").value.trim(),
    service_type: document.getElementById("svcType").value.trim(),
    vehicle: document.getElementById("svcVehicle").value.trim(),
    notes: document.getElementById("svcNotes").value.trim()
  };
  if (!data.name || !data.phone || !data.service_type) {
    result.innerHTML = '<div class="alert alert-danger py-1 small">Name, phone, and service type are required.</div>';
    return;
  }
  result.innerHTML = '<div class="spinner-border text-success spinner-border-sm"></div>';
  fetch(API_BASE + "/api/admin/service_records", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Admin-Password": adminPassword },
    body: JSON.stringify(data)
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.message && !d.message.includes("Error")) {
      result.innerHTML = '<div class="alert alert-success py-1 small">' + d.message + '</div>';
      setTimeout(function() { bootstrap.Modal.getInstance(document.getElementById("addServiceModal")).hide(); loadSection(); }, 1000);
    } else {
      result.innerHTML = '<div class="alert alert-danger py-1 small">' + d.message + '</div>';
    }
  }).catch(function() { result.innerHTML = '<div class="alert alert-danger py-1 small">Server error</div>'; });
}

function submitBlogPost(e) {
  e.preventDefault();
  var result = document.getElementById("blogAddResult");
  var data = {
    title: document.getElementById("blogTitle").value.trim(),
    excerpt: document.getElementById("blogExcerpt").value.trim(),
    content: document.getElementById("blogContent").value.trim(),
    category: document.getElementById("blogCategory").value
  };
  if (!data.title || !data.content) {
    result.innerHTML = '<div class="alert alert-danger py-1 small">Title and content are required.</div>';
    return;
  }
  result.innerHTML = '<div class="spinner-border text-success spinner-border-sm"></div>';
  fetch(API_BASE + "/api/admin/blog_posts", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Admin-Password": adminPassword },
    body: JSON.stringify(data)
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.message && !d.message.includes("Error")) {
      result.innerHTML = '<div class="alert alert-success py-1 small">' + d.message + '</div>';
      setTimeout(function() { bootstrap.Modal.getInstance(document.getElementById("addBlogModal")).hide(); loadSection(); }, 1000);
    } else {
      result.innerHTML = '<div class="alert alert-danger py-1 small">' + d.message + '</div>';
    }
  }).catch(function() { result.innerHTML = '<div class="alert alert-danger py-1 small">Server error</div>'; });
}
</script>

<!-- Add Service Record Modal -->
<div class="modal fade" id="addServiceModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title"><i class="bi bi-tools me-2"></i>New Service Record</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form onsubmit="submitServiceRecord(event)">
          <div class="mb-2"><label class="form-label small fw-bold">Name *</label><input type="text" id="svcName" class="form-control" required></div>
          <div class="mb-2"><label class="form-label small fw-bold">Email</label><input type="email" id="svcEmail" class="form-control"></div>
          <div class="mb-2"><label class="form-label small fw-bold">Phone *</label><input type="tel" id="svcPhone" class="form-control" required></div>
          <div class="mb-2"><label class="form-label small fw-bold">Service Type *</label>
            <select id="svcType" class="form-select" required>
              <option value="">Select service...</option>
              <option>Oil Change</option><option>Tire Rotation</option><option>Brake Service</option>
              <option>Engine Diagnostic</option><option>Transmission Service</option><option>Air Conditioning</option>
              <option>Battery Replacement</option><option>Wheel Alignment</option><option>General Inspection</option>
            </select>
          </div>
          <div class="mb-2"><label class="form-label small fw-bold">Vehicle</label><input type="text" id="svcVehicle" class="form-control" placeholder="e.g. Toyota Corolla"></div>
          <div class="mb-2"><label class="form-label small fw-bold">Notes</label><textarea id="svcNotes" class="form-control" rows="2" placeholder="Additional details..."></textarea></div>
          <div id="serviceAddResult"></div>
          <button type="submit" class="btn btn-success w-100">Save Record</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Add Blog Post Modal -->
<div class="modal fade" id="addBlogModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title"><i class="bi bi-journal-text me-2"></i>New Blog Post</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form onsubmit="submitBlogPost(event)">
          <div class="mb-2"><label class="form-label small fw-bold">Title *</label><input type="text" id="blogTitle" class="form-control" required></div>
          <div class="mb-2"><label class="form-label small fw-bold">Category</label>
            <select id="blogCategory" class="form-select">
              <option value="tips">Tips</option><option value="reviews">Reviews</option>
              <option value="industry">Industry</option><option value="guides">Guides</option>
            </select>
          </div>
          <div class="mb-2"><label class="form-label small fw-bold">Excerpt</label><input type="text" id="blogExcerpt" class="form-control" placeholder="Short summary..."></div>
          <div class="mb-2"><label class="form-label small fw-bold">Content *</label><textarea id="blogContent" class="form-control" rows="5" required placeholder="Write your post..."></textarea></div>
          <div id="blogAddResult"></div>
          <button type="submit" class="btn btn-success w-100">Publish Post</button>
        </form>
      </div>
    </div>
  </div>
</div>

</body>
</html>
