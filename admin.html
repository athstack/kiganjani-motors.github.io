<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiganjani Motors - Admin</title>
<link rel="stylesheet" href="KAYOMBO/bootstrap-5.0.2-dist/css/bootstrap.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{background:#f4f6f9;font-family:Arial,sans-serif}
.login-box{max-width:380px;margin:12% auto}
.table th{white-space:nowrap}
.badge-approved{background:#198754}
.badge-pending{background:#ffc107;color:#212529}
.stars{color:#198754}
</style>
</head>
<body>

<!-- Login -->
<div id="loginScreen">
  <div class="login-box">
    <div class="card shadow border-0">
      <div class="card-body p-4 text-center">
        <i class="bi bi-shield-lock text-success" style="font-size:3rem;"></i>
        <h4 class="fw-bold mt-2">Admin Dashboard</h4>
        <p class="text-muted small">Enter your admin password</p>
        <div id="loginMsg"></div>
        <div class="mb-3">
          <input type="password" id="adminPassword" class="form-control form-control-lg" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <button class="btn btn-success btn-lg w-100" onclick="doLogin()">Login</button>
        <a href="index.html" class="btn btn-link mt-2 text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to Website</a>
      </div>
    </div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboardScreen" style="display:none;">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold"><i class="bi bi-speedometer2 me-2"></i>Admin Dashboard</span>
      <button class="btn btn-outline-light btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </nav>
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="fw-bold mb-0">Customer Reviews</h4>
      <button class="btn btn-success btn-sm" onclick="loadReviews()"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
    </div>
    <div id="reviewStats" class="row g-3 mb-4"></div>
    <div id="dashboardMsg"></div>
    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Vehicle</th>
                <th>Rating</th>
                <th>Review</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="reviewsBody">
              <tr><td colspan="8" class="text-center text-muted py-4">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var API_BASE = "https://kiganjani-api.vercel.app";
var adminPassword = "";

function doLogin() {
  var pw = document.getElementById("adminPassword").value.trim();
  var msg = document.getElementById("loginMsg");
  if (!pw) { msg.innerHTML = '<div class="alert alert-warning py-2 small">Enter password</div>'; return; }
  msg.innerHTML = '<div class="text-center"><div class="spinner-border text-success spinner-border-sm"></div></div>';
  fetch(API_BASE + "/api/admin/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: pw })
  }).then(function(r) {
    return r.json().then(function(d) { return { ok: r.ok, data: d }; });
  }).then(function(resp) {
    if (resp.ok) {
      adminPassword = pw;
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboardScreen").style.display = "block";
      loadReviews();
    } else {
      msg.innerHTML = '<div class="alert alert-danger py-2 small">' + (resp.data.message || "Login failed") + '</div>';
    }
  }).catch(function() {
    msg.innerHTML = '<div class="alert alert-danger py-2 small">Server error</div>';
  });
}

function doLogout() {
  adminPassword = "";
  document.getElementById("dashboardScreen").style.display = "none";
  document.getElementById("loginScreen").style.display = "block";
  document.getElementById("adminPassword").value = "";
  document.getElementById("loginMsg").innerHTML = "";
}

function makeStars(n) {
  var s = "";
  for (var i = 0; i < 5; i++) {
    s += '<i class="bi bi-star' + (i < n ? '-fill' : '') + '"></i>';
  }
  return '<span class="stars">' + s + '</span>';
}

function formatDate(d) {
  if (!d) return "-";
  var dt = new Date(d);
  return dt.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
}

function loadReviews() {
  document.getElementById("reviewsBody").innerHTML = '<tr><td colspan="8" class="text-center py-4"><div class="spinner-border text-success"></div></td></tr>';
  fetch(API_BASE + "/api/admin/reviews?password=" + encodeURIComponent(adminPassword))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!Array.isArray(data)) {
        document.getElementById("reviewsBody").innerHTML = '<tr><td colspan="8" class="text-center text-danger py-4">' + (data.message || "Error loading") + '</td></tr>';
        return;
      }
      var total = data.length;
      var approved = data.filter(function(r) { return r.approved; }).length;
      var pending = total - approved;
      document.getElementById("reviewStats").innerHTML =
        '<div class="col-md-4"><div class="card shadow-sm border-0 text-center p-3"><h5 class="fw-bold text-primary mb-0">' + total + '</h5><small class="text-muted">Total Reviews</small></div></div>' +
        '<div class="col-md-4"><div class="card shadow-sm border-0 text-center p-3"><h5 class="fw-bold text-success mb-0">' + approved + '</h5><small class="text-muted">Approved</small></div></div>' +
        '<div class="col-md-4"><div class="card shadow-sm border-0 text-center p-3"><h5 class="fw-bold text-warning mb-0">' + pending + '</h5><small class="text-muted">Pending</small></div></div>';

      if (data.length === 0) {
        document.getElementById("reviewsBody").innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">No reviews yet</td></tr>';
        return;
      }
      var html = "";
      data.forEach(function(r) {
        html += '<tr>' +
          '<td class="fw-bold">' + r.id + '</td>' +
          '<td>' + esc(r.name) + '<br><small class="text-muted">' + esc(r.email || '') + '</small></td>' +
          '<td>' + esc(r.vehicle || '-') + '</td>' +
          '<td>' + makeStars(r.rating) + '</td>' +
          '<td style="max-width:250px;">' + esc(r.review_text) + '</td>' +
          '<td><span class="badge ' + (r.approved ? 'badge-approved' : 'badge-pending') + '">' + r.status + '</span></td>' +
          '<td><small>' + formatDate(r.created_at) + '</small></td>' +
          '<td style="white-space:nowrap;">';
        if (!r.approved) {
          html += '<button class="btn btn-sm btn-success me-1" onclick="approveReview(' + r.id + ')"><i class="bi bi-check-lg"></i></button>';
        }
        html += '<button class="btn btn-sm btn-danger" onclick="deleteReview(' + r.id + ')"><i class="bi bi-trash"></i></button>';
        html += '</td></tr>';
      });
      document.getElementById("reviewsBody").innerHTML = html;
    }).catch(function() {
      document.getElementById("reviewsBody").innerHTML = '<tr><td colspan="8" class="text-center text-danger py-4">Failed to load reviews</td></tr>';
    });
}

function approveReview(id) {
  var msg = document.getElementById("dashboardMsg");
  fetch(API_BASE + "/api/admin/reviews/" + id + "/approve", {
    method: "POST",
    headers: { "X-Admin-Password": adminPassword }
  }).then(function(r) { return r.json(); }).then(function(d) {
    msg.innerHTML = '<div class="alert alert-success py-2 small">' + d.message + '</div>';
    loadReviews();
    setTimeout(function() { msg.innerHTML = ""; }, 2000);
  }).catch(function() {
    msg.innerHTML = '<div class="alert alert-danger py-2 small">Failed</div>';
  });
}

function deleteReview(id) {
  if (!confirm("Delete this review?")) return;
  var msg = document.getElementById("dashboardMsg");
  fetch(API_BASE + "/api/admin/reviews/" + id, {
    method: "DELETE",
    headers: { "X-Admin-Password": adminPassword }
  }).then(function(r) { return r.json(); }).then(function(d) {
    msg.innerHTML = '<div class="alert alert-success py-2 small">' + d.message + '</div>';
    loadReviews();
    setTimeout(function() { msg.innerHTML = ""; }, 2000);
  }).catch(function() {
    msg.innerHTML = '<div class="alert alert-danger py-2 small">Failed</div>';
  });
}

function esc(str) {
  var div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
