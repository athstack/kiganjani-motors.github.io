<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiganjani Motors - Admin</title>
<link rel="stylesheet" href="KAYOMBO/bootstrap-5.0.2-dist/css/bootstrap.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<script src="KAYOMBO/bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;overflow:hidden}
.table th{white-space:nowrap}
.badge-approved,.badge-completed,.badge-confirmed,.badge-delivered,.badge-resolved,.badge-published{background:#198754;color:#fff}
.badge-pending,.badge-open,.badge-reserved{background:#ffc107;color:#212529}
.badge-processing,.badge-in_progress{background:#0dcaf0;color:#212529}
.badge-shipped{background:#0d6efd;color:#fff}
.badge-cancelled,.badge-closed,.badge-unpublished{background:#dc3545;color:#fff}
.badge-active,.badge-returned{background:#198754;color:#fff}
.stars{color:#198754}
.btn-delete{color:#dc3545;border:1px solid rgba(220,53,69,.3);background:transparent;font-size:.8rem;padding:2px 6px;transition:all .15s}
.btn-delete:hover{background:#dc3545;color:#fff;border-color:#dc3545}

/* Website iframe behind everything */
#siteFrame{position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:0}

/* Overlays */
.admin-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(2px)}
.admin-overlay.hidden{display:none}

/* Login card */
.login-card{max-width:400px;width:90%;position:relative}

/* Dashboard overlay */
.admin-dashboard-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:#f4f6f9;display:none;overflow:hidden}
.admin-dashboard-overlay.active{display:flex}

/* Sidebar */
.admin-sidebar{width:230px;min-width:230px;height:100vh;background:#111;color:#fff;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.admin-sidebar::-webkit-scrollbar{display:none}
.admin-sidebar .brand{padding:20px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.admin-sidebar .brand img{width:42px;height:42px;border-radius:8px;object-fit:cover}
.admin-sidebar .brand span{font-weight:700;font-size:.95rem;line-height:1.2}
.admin-sidebar .brand small{display:block;font-weight:400;font-size:.7rem;color:#999}
.admin-sidebar .nav-section{padding:12px 0 4px 16px;font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:#666;font-weight:600}
.admin-sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;color:#aaa;text-decoration:none;font-size:.88rem;transition:all .15s;cursor:pointer;border-left:3px solid transparent}
.admin-sidebar .nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.admin-sidebar .nav-item.active{background:rgba(25,135,84,.15);color:#198754;border-left-color:#198754;font-weight:600}
.admin-sidebar .nav-item i{font-size:1.05rem;width:20px;text-align:center}
.admin-sidebar .nav-badge{margin-left:auto;background:#198754;color:#fff;border-radius:50%;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;padding:0 5px}
.admin-sidebar .sidebar-footer{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.08)}

/* Main content */
.admin-main{flex:1;display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
.admin-footer{margin-top:auto;padding:14px 24px;border-top:1px solid #e9ecef;background:#fff;display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:#6c757d;flex-shrink:0}
.admin-footer .status-dot{width:8px;height:8px;background:#198754;border-radius:50%;display:inline-block;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Mobile sidebar overlay */
.sidebar-backdrop{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:10001}
.sidebar-backdrop.active{display:block}
@media(max-width:768px){
  .admin-sidebar{position:fixed;top:0;left:0;z-index:10002;transform:translateX(-100%);transition:transform .3s}
  .admin-sidebar.show{transform:translateX(0)}
}
</style>
</head>
<body>

<!-- Website iframe (always behind) -->
<iframe id="siteFrame" src="index.html"></iframe>

<!-- Login Overlay -->
<div class="admin-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="card shadow border-0">
      <div class="card-body p-4 text-center">
        <button class="btn position-absolute top-0 end-0 m-2 p-1 text-muted" onclick="closeLogin()" style="font-size:1.2rem;border:none;background:none;" title="Close">&times;</button>
        <i class="bi bi-shield-lock text-success" style="font-size:3rem;"></i>
        <h4 class="fw-bold mt-2">Admin Dashboard</h4>
        <p class="text-muted small">Enter your admin password</p>
        <div id="loginMsg"></div>
        <div class="mb-3">
          <input type="password" id="adminPassword" class="form-control form-control-lg" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <button class="btn btn-success btn-lg w-100" onclick="doLogin()">Login</button>
      </div>
    </div>
  </div>
</div>

<!-- Dashboard Overlay (full-screen) -->
<div class="admin-dashboard-overlay" id="dashboardOverlay">
  <!-- Mobile sidebar backdrop -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="brand">
      <img src="IMAGES/official_logo.png" alt="Logo">
      <span>Kiganjani Motors<small>Admin Panel</small></span>
    </div>
    <div class="nav-section">Main</div>
    <a class="nav-item active" onclick="switchTab('reviews',this)" data-tab="reviews">
      <i class="bi bi-star"></i>Reviews<span class="nav-badge" id="count-reviews">0</span>
    </a>
    <a class="nav-item" onclick="switchTab('bookings',this)" data-tab="bookings">
      <i class="bi bi-calendar-check"></i>Bookings<span class="nav-badge" id="count-bookings">0</span>
    </a>
    <a class="nav-item" onclick="switchTab('services',this)" data-tab="services">
      <i class="bi bi-tools"></i>Services<span class="nav-badge" id="count-services">0</span>
    </a>
    <a class="nav-item" onclick="switchTab('rentals',this)" data-tab="rentals">
      <i class="bi bi-car-front"></i>Rentals<span class="nav-badge" id="count-rentals">0</span>
    </a>
    <div class="nav-section">Commerce</div>
    <a class="nav-item" onclick="switchTab('parts',this)" data-tab="parts">
      <i class="bi bi-cart3"></i>Part Orders<span class="nav-badge" id="count-parts">0</span>
    </a>
    <a class="nav-item" onclick="switchTab('users',this)" data-tab="users">
      <i class="bi bi-people"></i>Orders<span class="nav-badge" id="count-users">0</span>
    </a>
    <div class="nav-section">Content</div>
    <a class="nav-item" onclick="switchTab('tickets',this)" data-tab="tickets">
      <i class="bi bi-headset"></i>Tickets<span class="nav-badge" id="count-tickets">0</span>
    </a>
    <a class="nav-item" onclick="switchTab('blog',this)" data-tab="blog">
      <i class="bi bi-journal-text"></i>Blog<span class="nav-badge" id="count-blog">0</span>
    </a>
    <div class="sidebar-footer">
      <button class="btn btn-outline-secondary btn-sm w-100" onclick="doLogout()"><i class="bi bi-box-arrow-left me-1"></i>Back to Site</button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="admin-main">
    <nav class="navbar bg-white border-bottom px-3">
      <div class="container-fluid">
        <button class="btn btn-outline-success d-md-none me-2" onclick="openSidebar()"><i class="bi bi-list fs-4"></i></button>
        <span class="navbar-brand mb-0 fw-bold text-dark"><i class="bi bi-speedometer2 me-2"></i><span id="sectionTitle">Reviews</span></span>
        <div>
          <button class="btn btn-success btn-sm me-1" id="addServiceBtn" style="display:none;" data-bs-toggle="modal" data-bs-target="#addServiceModal"><i class="bi bi-plus-lg me-1"></i>New Record</button>
          <button class="btn btn-success btn-sm me-1" id="addBlogBtn" style="display:none;" data-bs-toggle="modal" data-bs-target="#addBlogModal"><i class="bi bi-plus-lg me-1"></i>New Post</button>
          <button class="btn btn-outline-success btn-sm" onclick="loadSection()"><i class="bi bi-arrow-clockwise"></i></button>
        </div>
      </div>
    </nav>
    <div class="px-3 py-3" style="flex:1;overflow-y:auto;">
      <div id="dashboardMsg"></div>
      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark" id="tableHead"></thead>
              <tbody id="tableBody">
                <tr><td colspan="8" class="text-center text-muted py-4">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div class="admin-footer">
      <span>&copy; 2026 Kiganjani Motors Admin Panel. All rights reserved.</span>
      <span><span class="status-dot"></span>System Online</span>
    </div>
  </div>
</div>

<!-- Add Service Record Modal -->
<div class="modal fade" id="addServiceModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title"><i class="bi bi-tools me-2"></i>New Service Record</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form onsubmit="submitServiceRecord(event)">
          <div class="mb-2"><label class="form-label small fw-bold">Name *</label><input type="text" id="svcName" class="form-control" required></div>
          <div class="mb-2"><label class="form-label small fw-bold">Email</label><input type="email" id="svcEmail" class="form-control"></div>
          <div class="mb-2"><label class="form-label small fw-bold">Phone *</label><input type="tel" id="svcPhone" class="form-control" required></div>
          <div class="mb-2"><label class="form-label small fw-bold">Service Type *</label>
            <select id="svcType" class="form-select" required>
              <option value="">Select service...</option>
              <option>Oil Change</option><option>Tire Rotation</option><option>Brake Service</option>
              <option>Engine Diagnostic</option><option>Transmission Service</option><option>Air Conditioning</option>
              <option>Battery Replacement</option><option>Wheel Alignment</option><option>General Inspection</option>
            </select>
          </div>
          <div class="mb-2"><label class="form-label small fw-bold">Vehicle</label><input type="text" id="svcVehicle" class="form-control" placeholder="e.g. Toyota Corolla"></div>
          <div class="mb-2"><label class="form-label small fw-bold">Notes</label><textarea id="svcNotes" class="form-control" rows="2" placeholder="Additional details..."></textarea></div>
          <div id="serviceAddResult"></div>
          <button type="submit" class="btn btn-success w-100">Save Record</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Add Blog Post Modal -->
<div class="modal fade" id="addBlogModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title"><i class="bi bi-journal-text me-2"></i>New Blog Post</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form onsubmit="submitBlogPost(event)">
          <div class="mb-2"><label class="form-label small fw-bold">Title *</label><input type="text" id="blogTitle" class="form-control" required></div>
          <div class="mb-2"><label class="form-label small fw-bold">Category</label>
            <select id="blogCategory" class="form-select">
              <option value="tips">Tips</option><option value="reviews">Reviews</option>
              <option value="industry">Industry</option><option value="guides">Guides</option>
            </select>
          </div>
          <div class="mb-2"><label class="form-label small fw-bold">Excerpt</label><input type="text" id="blogExcerpt" class="form-control" placeholder="Short summary..."></div>
          <div class="mb-2"><label class="form-label small fw-bold">Content *</label><textarea id="blogContent" class="form-control" rows="5" required placeholder="Write your post..."></textarea></div>
          <div id="blogAddResult"></div>
          <button type="submit" class="btn btn-success w-100">Publish Post</button>
        </form>
      </div>
    </div>
  </div>
</div>

</body>
</html>
